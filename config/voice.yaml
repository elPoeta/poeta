# Sistema de voz (plan v1.1, secc. 8). null = por decidir tras la Fase 4.

stt:
  engine: faster-whisper
  # Elegido con scripts/stt_benchmark.py (ThinkPad P16, 8 audios): 0,23 s por frase, +1066 MiB de VRAM.
  # large-v3 fp16 daba 0,42 s pero +3865 MiB (no entra junto al LLM de 4,5 GB);
  # turbo en CPU: 3,4 s; distil-large-v3 es solo ingles (transcribio en ingles).
  model: large-v3-turbo
  device: cuda
  compute_type: int8_float16  # null = automatico (int8 en cpu, float16 en cuda)
  language: es
  beam_size: 5
  vad_filter: true
  min_silence_duration_ms: 500
  download_root: null      # null = <paths.models>/whisper (igual que vozboard)

wake_word:
  phrase: poeta
  engine: openwakeword
  model_path: null         # modelo personalizado a entrenar (no existe preentrenado)
  threshold: null          # calibrar con mediciones

tts:
  engine: kokoro           # kokoro | piper | qwen3
  resident: true           # mantener cargado en RAM (CPU)
  kokoro:
    runtime: onnx
    device: cpu
    voice: null            # fijar tras la prueba A/B
    speed: 1.0
  piper:
    voice: null            # por ejemplo, una voz es_MX masculina
  qwen3:
    model: 0.6B
    device: null
