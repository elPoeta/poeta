[project]
name = "poeta"
version = "0.1.0"
description = "P.O.E.T.A. - Personal Offline Executive & Thinking Assistant"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["poeta*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
